name: A-share historical data smoke test
on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and validate 10 A-share K-lines
        run: python scripts/fetch_daily.py
      - name: Upload validation outputs even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-share-smoke-test
          path: data/
          if-no-files-found: warn
      - name: Commit validated CSV on full success
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update historical A-share sample data"
            git push
          fi
